<text x="18" y="48" font-size="13" fill="#e8e8e0" font-weight="700" xml:space="preserve">$ fibo --lang ru</text>
<text x="18" y="68" font-size="13" fill="#b5e853" font-weight="700" xml:space="preserve">  (o,o)   fibo · /tmp/fibo-demo</text>
<text x="18" y="88" font-size="13" fill="#b5e853" xml:space="preserve">  /)_)</text>
<text x="18" y="108" font-size="13" fill="#b5e853" xml:space="preserve">   ""</text>
<text x="18" y="128" font-size="13" fill="#e8e8e0" xml:space="preserve"></text>
<text x="18" y="148" font-size="13" fill="#e8e8e0" xml:space="preserve">230 задач · 225 закрыто · 194 с оценкой · 169 засчитано</text>
<text x="18" y="168" font-size="13" fill="#e8e8e0" xml:space="preserve"></text>
<text x="18" y="188" font-size="13" fill="#e8e8e0" xml:space="preserve">  сказал «2 дня»   — вышло 9.6 дня   ×4.8</text>
<text x="18" y="208" font-size="13" fill="#e8e8e0" xml:space="preserve">  сказал «день»    — вышло 2.7 дня   ×2.7</text>
<text x="18" y="228" font-size="13" fill="#e8e8e0" xml:space="preserve">  сказал «4 часа»  — вышло 14 часов  ×3.4</text>
<text x="18" y="248" font-size="13" fill="#e8e8e0" xml:space="preserve"></text>
<text x="18" y="268" font-size="13" fill="#b5e853" font-weight="700" xml:space="preserve">  твой множитель          3.7×   календарно 5.2×</text>
<text x="18" y="288" font-size="13" fill="#f0c419" xml:space="preserve">  в худшем случае (p90)   8.6×</text>
<text x="18" y="308" font-size="13" fill="#e8e8e0" xml:space="preserve">  недооценил              91% задач</text>
<text x="18" y="328" font-size="13" fill="#e8e8e0" xml:space="preserve"></text>
<text x="18" y="348" font-size="13" fill="#9a9f98" xml:space="preserve">  по типам работы</text>
<text x="18" y="368" font-size="13" fill="#e8e8e0" xml:space="preserve">    багфиксы       ×1.3    n=42</text>
<text x="18" y="388" font-size="13" fill="#e8e8e0" xml:space="preserve">    фичи           ×3.7    n=66</text>
<text x="18" y="408" font-size="13" fill="#e8e8e0" xml:space="preserve">    рефакторинг    ×5.7    n=39</text>
<text x="18" y="428" font-size="13" fill="#e8e8e0" xml:space="preserve">    миграции       ×7.1    n=20</text>
<text x="18" y="448" font-size="13" fill="#e8e8e0" xml:space="preserve"></text>
<text x="18" y="468" font-size="13" fill="#e8e8e0" xml:space="preserve">  дрейф   3.7× ▄▃▃▃▄▃█▆▁▁▁▆ 4.5×</text>
<text x="18" y="488" font-size="13" fill="#6f7a6a" xml:space="preserve">          два года назад  сейчас</text>
<text x="18" y="508" font-size="13" fill="#e8e8e0" xml:space="preserve"></text>
<text x="18" y="528" font-size="13" fill="#9a9f98" xml:space="preserve">исключено: 25 задач (оценка после старта: 14 · не длительность: 5 · нет ветки: 4 · points не время: 2)</text>
<text x="18" y="548" font-size="13" fill="#9a9f98" xml:space="preserve">один субъект — ты: you@fibo.demo</text>
