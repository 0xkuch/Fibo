<text x="18" y="48" font-size="13" fill="#e8e8e0" font-weight="700" xml:space="preserve">$ fibo say PROJ-464 soon</text>
<text x="18" y="68" font-size="13" fill="#ff4d5e" xml:space="preserve">(ò,ó)  ✗ "soon" is not a duration. Say a number and a unit: 2d, 4h, 1w.</text>
<text x="18" y="88" font-size="13" fill="#e8e8e0" xml:space="preserve"></text>
<text x="18" y="108" font-size="13" fill="#e8e8e0" font-weight="700" xml:space="preserve">$ fibo say PROJ-416 2d</text>
<text x="18" y="128" font-size="13" fill="#ff4d5e" xml:space="preserve">(ò,ó)  ✗ written after the work began: first commit 54f0806 on 2026-08-18 15:17.</text>
<text x="18" y="148" font-size="13" fill="#e8e8e0" xml:space="preserve"></text>
<text x="18" y="168" font-size="13" fill="#e8e8e0" font-weight="700" xml:space="preserve">$ fibo --whose someone@else.com</text>
<text x="18" y="188" font-size="13" fill="#ff4d5e" xml:space="preserve">(ò,ó)  ✗ this tool has one subject. someone@else.com is not one of your addresses (you@fibo.demo).</text>
<text x="18" y="208" font-size="13" fill="#e8e8e0" xml:space="preserve"></text>
<text x="18" y="228" font-size="13" fill="#e8e8e0" font-weight="700" xml:space="preserve">$ fibo say PROJ-464 3 points</text>
<text x="18" y="248" font-size="13" fill="#ff4d5e" xml:space="preserve">(ò,ó)  ✗ points are not time. There is --points-as-hours=N, and the output will say the number rests on your assumption.</text>
<text x="18" y="268" font-size="13" fill="#e8e8e0" xml:space="preserve"></text>
<text x="18" y="288" font-size="13" fill="#e8e8e0" font-weight="700" xml:space="preserve">$ fibo export</text>
<text x="18" y="308" font-size="13" fill="#ff4d5e" xml:space="preserve">(ò,ó)  ✗ fibo export: it predicts nothing, exports nothing, aggregates nobody.</text>
