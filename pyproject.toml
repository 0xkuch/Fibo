[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fibo"
version = "0.1.0"
description = "git blame for your promises"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Fibo contributors" }]
keywords = ["git", "estimates", "cli", "jira", "linear", "terminal"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Version Control :: Git",
]
dependencies = []

[project.scripts]
fibo = "fibo.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
